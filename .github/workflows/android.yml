name: Android qualification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag }}

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Pinned Android toolchain and host shader tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache spirv-tools libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install -r requirements-build.txt
      - uses: actions/cache@v4
        id: qt
        with:
          path: out/qt
          key: qt683-linux-android-arm64-x64-host-v1
      - name: Install matching host tools and both Android SDKs
        if: steps.qt.outputs.cache-hit != 'true'
        run: python tools/setup_qt.py --target android --output out/qt
      - uses: actions/cache@v4
        id: compiler
        with:
          path: out/dxc
          key: dxc-v1825051-linux-x64-v1
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: python tools/fetch_dxc.py --output out/dxc
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: out/vulkan-headers
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: android-objects-qt683-ndk261-v1-${{ github.sha }}
          restore-keys: android-objects-qt683-ndk261-v1-
      - uses: actions/cache@v4
        with:
          path: out/editor-fonts
          key: android-fonts-noto2004-b76b0433
      - name: Build native ARM64 and the same application for emulator qualification
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 700M
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ ! -f out/editor-fonts/NotoSansCJK-Regular.ttc ]; then
            python tools/fetch_editor_fonts.py --output out/editor-fonts
          fi
          out/qt/6.8.3/android_arm64_v8a/bin/qt-cmake -S cmake/portable-editor -B out/android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" \
            -DQT_HOST_PATH="$PWD/out/qt/6.8.3/gcc_64" -DMDS_RELEASE_TAG="$RELEASE_TAG" \
            -DMDS_DXC="$PWD/out/dxc/bin/dxc" -DMDS_SPIRV_VAL=/usr/bin/spirv-val \
            -DMDS_VULKAN_INCLUDE="$PWD/out/vulkan-headers/include" \
            -DMDS_EDITOR_FONT_FILE="$PWD/out/editor-fonts/NotoSansCJK-Regular.ttc" \
            '-DQT_ANDROID_ABIS=arm64-v8a;x86_64' \
            '-DQT_ANDROID_MULTI_ABI_FORWARD_VARS=BUILD_TESTING;MDS_DXC;MDS_SPIRV_VAL;MDS_VULKAN_INCLUDE;MDS_RELEASE_TAG;MDS_EDITOR_FONT_FILE;CMAKE_SHARED_LINKER_FLAGS' \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384
          cmake --build out/android --target apk --parallel 3
      - name: Inspect and sign shipping APK with the persistent release key
        if: inputs.release_tag
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mds-release.keystore
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          apk=$(find out/android -path '*/outputs/apk/release/*-unsigned.apk' -print -quit)
          test -n "$apk"
          python tools/package_android.py --apk "$apk" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --tag "$RELEASE_TAG"
      - name: Sign development qualification package (never a Release asset)
        if: ${{ !inputs.release_tag }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qualification.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: qualification
          ANDROID_KEY_PASSWORD: android
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storepass android -keypass android \
            -alias qualification -dname 'CN=NG isolated qualification' -keyalg RSA -validity 2
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          apk=$(find out/android -path '*/outputs/apk/release/*-unsigned.apk' -print -quit)
          test -n "$apk"
          python tools/package_android.py --apk "$apk" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Permit KVM only on this isolated emulator runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and qualify actual Android rendering and suspend/recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: |
            apk=$(find out/releases -name '*-android-universal.apk' -print -quit)
            test -n "$apk"
            python tests/test_android_distribution.py --apk "$apk" --output out/android-tests
      - uses: actions/upload-artifact@v4
        if: success() && inputs.release_tag
        with:
          name: editor-dist-android-universal
          path: |
            out/releases/MikuDanceStudio-NG-*-android-universal.apk
            out/releases/MikuDanceStudio-NG-*-android-universal.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-qualification
          path: |
            out/android-tests/
            out/android/android-package/assets/build-info.json
            out/android/CMakeFiles/CMakeConfigureLog.yaml
            out/android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: warn
