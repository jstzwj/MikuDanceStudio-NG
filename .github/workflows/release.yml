name: Release portable editor

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag (never a branch)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable tag, version and release notes
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -s "docs/releases/$RELEASE_TAG.md"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require the persistent Android release signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android release signing secret: $name; do not publish a debug-signed APK."
              exit 1
            fi
          done
  desktop:
    needs: validate
    uses: ./.github/workflows/portable-editor.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit
  publish:
    needs: [validate, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-dist-*
          merge-multiple: true
          path: packages
      - name: Reject incomplete, mislabeled or modified packages
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --packages packages
      - name: Publish only the tested portable packages and APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Release already exists. Published assets are immutable; use a new version.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "MikuDanceStudio-NG $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" packages/*
