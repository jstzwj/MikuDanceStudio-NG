name: Release portable editor

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag for publication
        required: false
        type: string
      candidate:
        description: Qualify the selected commit and upload five candidate artifacts
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.candidate && github.sha || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate && github.sha || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable tag, version and release notes
        if: "!inputs.candidate"
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Provide an existing version tag, or choose candidate.'
            exit 1
          fi
          python scripts/release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -s "docs/releases/$RELEASE_TAG.md"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate candidate source
        if: inputs.candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -z "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/release.py
      - name: Require the persistent Android release signing identity
        if: "!inputs.candidate"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android release signing secret: $name; do not publish a debug-signed APK."
              exit 1
            fi
          done
  desktop:
    needs: validate
    uses: ./.github/workflows/portable-editor.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
      candidate: ${{ inputs.candidate == true }}
  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
      candidate: ${{ inputs.candidate == true }}
    secrets: inherit
  qualify:
    needs: [validate, desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-dist-*
          merge-multiple: true
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-media-*
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-symbols-*
          path: evidence
      - name: Reject incomplete, mislabeled or modified packages
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_CANDIDATE: ${{ inputs.candidate == true }}
        run: |
          if [ "$RELEASE_CANDIDATE" = true ]; then
            python scripts/release.py --candidate --packages packages --evidence evidence
          else
            python scripts/release.py --tag "$RELEASE_TAG" --packages packages --evidence evidence
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-portable-packages
          path: packages/
          compression-level: 0
          if-no-files-found: error
  publish:
    if: "!inputs.candidate"
    needs: [validate, qualify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: qualified-portable-packages
          path: packages
      - name: Publish only the tested portable packages and APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Release already exists. Published assets are immutable; use a new version.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "MikuDanceStudio-NG $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" packages/*
