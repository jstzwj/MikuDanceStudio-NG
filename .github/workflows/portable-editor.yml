name: Portable editor
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform to validate (all by default)
        default: all
        options: [all, windows, linux, macos, linux-macos]
      macos_runner:
        type: choice
        description: macOS acceptance image
        default: macos-15
        options: [macos-15, macos-26]
      windows_runner:
        type: choice
        description: Windows acceptance image
        default: windows-2022
        options: [windows-2022, windows-2025]
      native_reference:
        type: boolean
        description: Visual scene qualification plus strict original-capture diagnostics
        default: false
      native_controls:
        type: boolean
        description: Qualify native EDIT nonclient paint in isolated Windows runner windows
        default: false
      ui_only:
        type: boolean
        description: Linux/macOS frontend font, chrome and edit gates only (no media or packaging)
        default: false
      native_multiline:
        type: boolean
        description: Qualify shown multiline focus, paint and OS mouse gestures on isolated Windows runner
        default: false
      ui_shown:
        type: boolean
        description: Remaining shown UI qualification (Windows outside drags/Unicode, Linux/macOS focus/popups)
        default: false
      observers_only:
        type: boolean
        description: Windows hidden control observers only (no shown input or package rebuild)
        default: false
      system_ime:
        type: boolean
        description: Qualify real platform IMEs on isolated Windows, Linux and macOS runners
        default: false
concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}-${{ inputs.macos_runner || 'macos-15' }}-${{ inputs.windows_runner || 'windows-2022' }}-${{ inputs.ui_only && 'ui' || inputs.observers_only && 'observers' || inputs.system_ime && 'ime' || inputs.native_controls && 'controls' || inputs.native_reference && 'reference' || 'regular' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  format:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-format.txt
      - name: Check changed first-party sources
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_REVISION}^{commit}" 2>/dev/null; then
            BASE_REVISION=$(git rev-parse HEAD^)
          fi
          python scripts/format_sources.py --check --changed "$BASE_REVISION"
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: ${{ inputs.windows_runner || 'windows-2022' }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 700M
      MDS_OBSERVERS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.observers_only && !inputs.system_ime && !inputs.native_controls && !inputs.native_reference }}
      MDS_IME_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.system_ime && !inputs.native_controls && !inputs.native_reference }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tagged product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - uses: actions/cache@v4
        with:
          path: out/p4/editor-fonts
          key: editor-fonts-${{ runner.os }}-noto2004-b76b0433
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          aqtversion: '==3.3.0'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .cache/sccache
          key: editor-objects-${{ inputs.windows_runner || 'windows-2022' }}-x64-qt683-${{ github.sha }}
          restore-keys: editor-objects-${{ inputs.windows_runner || 'windows-2022' }}-x64-qt683-
      - uses: actions/cache@v4
        id: renderer-tools
        with:
          path: |
            out/dxc
            out/spirv-tools
          key: editor-tools-windows2022-x64-dxc1825051-spirv20252-v1
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: out/vulkan-headers
      - name: Fetch renderer tools
        if: steps.renderer-tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python tools/fetch_dxc.py --output out/dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch v2025.2 https://github.com/KhronosGroup/SPIRV-Tools.git out/spirv-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python out/spirv-source/utils/git-sync-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S out/spirv-source -B out/spirv-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/spirv-build --target spirv-val --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out/spirv-tools | Out-Null
          Copy-Item out/spirv-build/tools/spirv-val.exe out/spirv-tools/
      - name: Build editor with DX11, DX12 and Vulkan
        run: |
          cmake -S cmake/portable-editor -B out/p4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DMDS_VULKAN_INCLUDE="$PWD/out/vulkan-headers/include" -DMDS_DXC="$PWD/out/dxc/dxc.exe" -DMDS_SPIRV_VAL="$PWD/out/spirv-tools/spirv-val.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:MDS_OBSERVERS_ONLY -eq 'true') {
            cmake --build out/p4 --config Release --target qt_control_style_test qt_multiline_paint_test qt_multiline_active_test --parallel 3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ('${{ inputs.ui_shown }}' -eq 'true') {
              cmake --build out/p4 --config Release --target qt_multiline_extended_test qt_multiline_drag_test qt_multiline_layout_test qt_numeric_test qt_static_label_test --parallel 3
            }
            exit $LASTEXITCODE
          }
          if ($env:MDS_IME_ONLY -eq 'true') {
            cmake --build out/p4 --config Release --target qt_system_ime_test --parallel 3
            exit $LASTEXITCODE
          }
          cmake --build out/p4 --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ inputs.ui_shown }}' -eq 'true') {
            cmake --build out/p4 --config Release --target qt_multiline_extended_test --parallel 3
          }
      - name: Offscreen editor and generated export
        # IME-only dispatches qualify the native input client; push/PR and
        # control/reference dispatches retain the complete editor regression.
        if: env.MDS_IME_ONLY != 'true' && env.MDS_OBSERVERS_ONLY != 'true'
        env:
          MDS_GPU_BACKEND: d3d11
          MDS_GPU_DRIVER: software
        run: |
          ctest --test-dir out/p4 -C Release -L p4 --output-on-failure --output-junit p4.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/p4/qt_editor_font_test.exe res/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test.exe --assets res/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MDS_GPU_BACKEND = 'd3d12'
          python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test.exe --assets res/assets
      - name: Hidden control observers only
        if: env.MDS_OBSERVERS_ONLY == 'true'
        run: ctest --test-dir out/p4 -C Release -R '^(qt_control_style|qt_control_text|qt_list_content|qt_edit_content|qt_multiline_paint)$' --output-on-failure --output-junit p4.xml
      - name: Actual multiline focus and mouse qualification
        if: ${{ !cancelled() && inputs.native_multiline }}
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: windows
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: out/p4/qt_multiline_active_test.exe out/p4/multiline-active
      - name: Native silent audio clock
        if: ${{ !cancelled() && env.MDS_IME_ONLY != 'true' && env.MDS_OBSERVERS_ONLY != 'true' }}
        run: python tests/test_native_audio.py --test out/p4/qt_native_audio_test.exe --report out/p4/native-audio.json --allow-unavailable
      - name: Outside-client multiline drag and complex text qualification
        if: ${{ !cancelled() && inputs.ui_shown }}
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: windows
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          ctest --test-dir out/p4 -C Release -R '^(qt_multiline_drag|qt_multiline_unicode|qt_multiline_layout|qt_numeric(_dpi_.*)?|qt_static_label(_native)?)$' --output-on-failure --output-junit multiline-drag.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/p4/qt_multiline_extended_test.exe out/p4/multiline-extended
      - name: Qualify native EDIT nonclient paint
        if: ${{ !cancelled() && inputs.native_controls }}
        timeout-minutes: 10
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          # Collect all independent families in one qualification batch, while
          # retaining failure for any family. An early failure must not force
          # another dispatch just to obtain the remaining diagnostics.
          $profiles = @(
            @('--isolated-nonclient', 'out/p4/control-style-nonclient'),
            @('--isolated-edit-text', 'out/p4/control-edit-visible'),
            @('--isolated-edit-focus', 'out/p4/control-edit-focus'),
            @('--isolated-edit-hover', 'out/p4/control-edit-hover'),
            @('--isolated-content', 'out/p4/control-content-visible'),
            @('--isolated-list-focus', 'out/p4/control-list-focus'),
            @('--isolated-content-focus', 'out/p4/control-content-focus')
          )
          $results = foreach ($profile in $profiles) {
            & out/p4/qt_control_style_test.exe $profile[0] $profile[1] 2>&1 | Tee-Object -FilePath "$($profile[1]).log" | Out-Host
            [PSCustomObject]@{ profile = $profile[0]; exitCode = $LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content out/p4/control-qualification.json -Encoding UTF8
          if (@($results | Where-Object exitCode -ne 0).Count) { exit 1 }
          exit 0
      - name: Retain control diagnostics before optional OS language servicing
        if: ${{ !cancelled() && inputs.native_controls }}
        uses: actions/upload-artifact@v4
        with:
          name: p4-windows-control-reports
          path: |
            out/p4/control-*/report.json
            out/p4/control-*.log
            out/p4/control-qualification.json
          if-no-files-found: error
      - name: Qualify native Japanese input and command ordering
        if: ${{ !cancelled() && inputs.system_ime }}
        timeout-minutes: 15
        shell: powershell
        env:
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          $languages = Get-WinUserLanguageList
          if ($languages.LanguageTag -notcontains 'ja-JP') {
            $languages.Add('ja-JP')
            Set-WinUserLanguageList $languages -Force
          }
          $capability = Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          $capability | Select-Object Name,State | ConvertTo-Json | Set-Content out/p4/system-ime-install.json -Encoding UTF8
          Write-Host "Japanese IME capability before servicing: $($capability.State)"
          if ($capability.State -ne 'Installed') {
            $installed = Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
            if ($installed.RestartNeeded) { throw 'Japanese IME installation requires a fresh logon/reboot; this runner cannot qualify it yet' }
          }
          # A hosted image may disable the service required by ctfmon. Prepare
          # only this disposable CI session; never apply this on a developer PC.
          $inputServices = @(Get-Service -Name TabletInputService,TextInputManagementService -ErrorAction SilentlyContinue)
          foreach ($service in $inputServices) {
            if ($service.StartType -eq 'Disabled') { Set-Service $service.Name -StartupType Manual }
            if ($service.Status -ne 'Running') { Start-Service $service.Name -ErrorAction Stop }
            $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(10))
          }
          $inputServices | Select-Object Name,Status,StartType | ConvertTo-Json | Set-Content out/p4/system-ime-environment.json -Encoding UTF8
          Start-Process "$env:WINDIR/System32/ctfmon.exe" -WindowStyle Hidden
          cmake --build out/p4 --config Release --target qt_system_ime_test native_ime_shutdown_test --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_native_system_ime.py --test out/p4/qt_system_ime_test.exe --report out/p4/system-ime-ms-ime.json
          $editorExit = $LASTEXITCODE
          # Run the editor first: a failed reference teardown can leave the
          # shared OS broker blocked and invalidate a following editor scenario.
          # The reference never turns an editor failure into a passing result.
          python tests/test_native_ime_shutdown.py --test out/p4/native_ime_shutdown_test.exe --report out/p4/system-ime-native-reference.json
          $referenceExit = $LASTEXITCODE
          Get-Process ctfmon,imebroker,TextInputHost -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId,Path | ConvertTo-Json | Set-Content out/p4/system-ime-processes.json -Encoding UTF8
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'imebroker|imjp|ctfmon' } | Select-Object TimeCreated,Id,ProviderName,Message | ConvertTo-Json | Set-Content out/p4/system-ime-events.json -Encoding UTF8
          if ($editorExit -ne 0) { exit $editorExit }
          if ($referenceExit -ne 0) { exit $referenceExit }
      - name: Qualify original composite capture and retain numerical diagnostics
        if: ${{ !cancelled() && inputs.native_reference }}
        env:
          MDS_GPU_BACKEND: d3d11
          MDS_GPU_DRIVER: software
        run: ctest --test-dir out/p4 -C Release -L native-reference --output-on-failure --output-junit native-reference.xml
      - name: Deploy and validate relocated package
        if: ${{ !cancelled() && env.MDS_IME_ONLY != 'true' && env.MDS_OBSERVERS_ONLY != 'true' }}
        shell: bash
        run: |
          cmake --build out/p4 --config Release --target dist --parallel 3
          python tests/test_editor_distribution.py --dist out/dist
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.MDS_IME_ONLY != 'true' && env.MDS_OBSERVERS_ONLY != 'true' }}
        with:
          name: editor-dist-windows
          path: |
            out/releases/MikuDanceStudio-NG-*.zip
            out/releases/MikuDanceStudio-NG-*.tar.gz
            out/releases/MikuDanceStudio-NG-*.sha256
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && github.event_name != 'pull_request' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .cache/sccache
          key: editor-objects-${{ inputs.windows_runner || 'windows-2022' }}-x64-qt683-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-windows
          path: |
            out/p4/p4.xml
            out/p4/native-reference.xml
            out/p4/native-reference/
            out/p4/system-ime*
            out/p4/control-style/
            out/p4/control-qualification.json
            out/p4/control-style-nonclient/
            out/p4/control-edit-visible/
            out/p4/control-edit-focus/
            out/p4/control-edit-hover/
            out/p4/edit-content/
            out/p4/multiline-paint/
            out/p4/multiline-active/
            out/p4/multiline-extended/
            out/p4/multiline-drag.xml
            out/p4/multiline-unicode/
            out/p4/static-label-portable/
            out/p4/static-label-native/
            out/p4/editor-chrome/
            out/p4/control-content-visible/
            out/p4/control-list-focus/
            out/p4/control-content-focus/
            out/distribution-check.*
            out/p4/editor-frame-performance*.json
            out/p4/native-audio*.json
            out/p4/Testing/Temporary/
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'linux-macos'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate tagged product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - uses: actions/cache@v4
        with:
          path: out/p4/editor-fonts
          key: editor-fonts-${{ runner.os }}-noto2004-b76b0433
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: out/vulkan-headers
      - run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache patchelf spirv-tools libvulkan1 mesa-vulkan-drivers libxcb1-dev libwayland-dev wayland-protocols libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1 libpulse-dev xvfb weston
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          aqtversion: '==3.3.0'
          modules: qtmultimedia qtwaylandcompositor
          cache: true
      - uses: actions/cache@v4
        id: compiler
        with:
          path: out/dxc
          key: dxc-v1825051-linux-x64-v1
      - run: python tools/fetch_dxc.py --output out/dxc
        if: steps.compiler.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .cache/ccache
          key: editor-objects-ubuntu2204-${{ runner.arch }}-qt683-v1-${{ github.sha }}
          restore-keys: editor-objects-ubuntu2204-${{ runner.arch }}-qt683-v1-
      - name: Build and test editor
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 700M
          MDS_GPU_DRIVER: software
        run: |
          cmake -S cmake/portable-editor -B out/p4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DMDS_VULKAN_INCLUDE="$PWD/out/vulkan-headers/include" -DMDS_DXC="$PWD/out/dxc/bin/dxc"
          if [ "${{ inputs.ui_only }}" = true ]; then
            cmake --build out/p4 --target qt_editor_font_test qt_editor_chrome_test qt_numeric_test qt_edit_navigation_test qt_static_label_test --parallel 3
            ctest --test-dir out/p4 -R '^(qt_editor_font|qt_editor_chrome|qt_numeric|qt_edit_navigation|qt_static_label)$' --output-on-failure --output-junit p4.xml
            exit $?
          fi
          cmake --build out/p4 --parallel 3
          cmake --build out/p4 --target qt_wayland_pointer_test --parallel 3
          ctest --test-dir out/p4 -L p4 --output-on-failure --output-junit p4.xml
      - name: Qt X11 and Wayland surfaces in isolated displays
        if: ${{ !inputs.ui_only }}
        env:
          MDS_GPU_DRIVER: software
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          xvfb-run -a env QT_QPA_PLATFORM=xcb python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test --assets res/assets
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-pixman --socket=mds-p4 --width=1024 --height=768 --idle-time=0 >out/p4/weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 50); do test -S "$XDG_RUNTIME_DIR/mds-p4" && break; sleep 0.1; done
          export WAYLAND_DISPLAY=mds-p4 QT_QPA_PLATFORM=wayland
          python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test --assets res/assets
      - name: Actual shown portable controls and menus
        if: ${{ !cancelled() && inputs.ui_shown }}
        timeout-minutes: 4
        env:
          MDS_QT_ISOLATED_DISPLAY: '1'
          MDS_GPU_DRIVER: software
        run: |
          cmake --build out/p4 --target qt_shown_ui_test --parallel 3
          xvfb-run -a env QT_QPA_PLATFORM=xcb python tests/test_shown_ui.py --test out/p4/qt_shown_ui_test --assets res/assets --output out/p4/shown-ui
      - name: Qualify original composite capture and retain numerical diagnostics
        if: ${{ !cancelled() && inputs.native_reference }}
        env:
          MDS_GPU_DRIVER: software
        run: ctest --test-dir out/p4 -L native-reference --output-on-failure --output-junit native-reference.xml
      - name: Qualify real IBus composition and command ordering
        if: ${{ !cancelled() && inputs.system_ime }}
        env:
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          sudo apt-get install -y ibus ibus-libpinyin ibus-anthy dbus-x11 xdotool
          cmake --build out/p4 --target qt_system_ime_test --parallel 3
          xvfb-run -a dbus-run-session -- python tests/test_system_ime.py --test out/p4/qt_system_ime_test --report out/p4/system-ime.json
          xvfb-run -a dbus-run-session -- python tests/test_system_ime.py --test out/p4/qt_system_ime_test --engine anthy --report out/p4/system-ime-anthy.json
      - name: Native PulseAudio silent clock
        if: ${{ !cancelled() && !inputs.ui_only }}
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          # Bound this explicit virtual-device profile to a 50 ms maximum
          # queue. The module's default rewind history starts at two seconds,
          # independently of the stream's requested 100 ms buffer.
          pactl load-module module-null-sink sink_name=mds_acceptance rate=48000 channels=2 norewinds=1
          pactl set-default-sink mds_acceptance
          smoke_status=0
          python tests/test_native_audio.py --test out/p4/qt_native_audio_test --seconds 3 --report out/p4/native-audio-smoke.json || smoke_status=$?
          python tests/test_native_audio.py --test out/p4/qt_native_audio_test --report out/p4/native-audio.json
          test "$smoke_status" -eq 0
      - name: Deploy and validate relocated package
        if: ${{ !cancelled() && !inputs.ui_only }}
        shell: bash
        run: |
          cmake --build out/p4 --config Release --target dist --parallel 3
          python tests/test_editor_distribution.py --dist out/dist
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.ui_only }}
        with:
          name: editor-dist-linux
          path: |
            out/releases/MikuDanceStudio-NG-*.zip
            out/releases/MikuDanceStudio-NG-*.tar.gz
            out/releases/MikuDanceStudio-NG-*.sha256
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && github.event_name != 'pull_request' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .cache/ccache
          key: editor-objects-ubuntu2204-${{ runner.arch }}-qt683-v1-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-linux
          path: |
            out/p4/p4.xml
            out/p4/native-reference.xml
            out/p4/native-reference/
            out/p4/system-ime*
            out/p4/editor-chrome/
            out/p4/shown-ui/
            out/p4/static-label-portable/
            out/distribution-check.*
            out/p4/editor-frame-performance*.json
            out/p4/native-audio*.json
            out/p4/Testing/Temporary/
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == 'linux-macos'
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    env:
      MDS_MACOS_CACHE: ${{ inputs.macos_runner == 'macos-26' && 'macos26' || 'macos15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tagged product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - uses: actions/cache@v4
        with:
          path: out/p4/editor-fonts
          key: editor-fonts-${{ runner.os }}-noto2004-b76b0433
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: compiler
        with:
          path: out/dxc
          key: dxc-b106a961-macos15-arm64-v1
      - uses: actions/checkout@v4
        if: steps.compiler.outputs.cache-hit != 'true'
        with:
          repository: microsoft/DirectXShaderCompiler
          ref: b106a961d09221b3c5bdb37be45b679257da08b8
          submodules: recursive
          path: out/dxc-source
      - name: Build pinned upstream DXC
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          cmake -S out/dxc-source -B out/dxc-build -G Ninja -C out/dxc-source/cmake/caches/PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DHLSL_INCLUDE_TESTS=OFF -DSPIRV_BUILD_TESTS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_ENABLE_WERROR=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build out/dxc-build --target dxc --parallel 3
          mkdir -p out/dxc/bin out/dxc/lib
          cp out/dxc-build/bin/dxc out/dxc/bin/
          cp -L out/dxc-build/lib/libdxcompiler*.dylib out/dxc/lib/
          cp out/dxc-source/LICENSE.TXT out/dxc-source/ThirdPartyNotices.txt out/dxc/
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: out/vulkan-headers
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          aqtversion: '==3.3.0'
          modules: qtmultimedia
          cache: true
      - run: chmod +x out/dxc/bin/dxc && brew install spirv-tools ccache
      - uses: actions/cache@v4
        id: moltenvk
        with:
          path: out/moltenvk
          key: moltenvk-142-macos-arm64-licenses-v2
      - run: python tools/fetch_moltenvk_probe.py --output out/moltenvk
        if: steps.moltenvk.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .cache/ccache
          key: editor-objects-${{ env.MDS_MACOS_CACHE }}-${{ runner.arch }}-qt683-v1-${{ github.sha }}
          restore-keys: editor-objects-${{ env.MDS_MACOS_CACHE }}-${{ runner.arch }}-qt683-v1-
      - name: Build and test editor
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 700M
          MTL_DEBUG_LAYER: '1'
          MDS_TEST_VULKAN_LIBRARY: ${{ github.workspace }}/out/moltenvk/libMoltenVK.dylib
        run: |
          cmake -S cmake/portable-editor -B out/p4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DMDS_MOLTENVK_LIBRARY="$PWD/out/moltenvk/libMoltenVK.dylib" -DMDS_VULKAN_INCLUDE="$PWD/out/vulkan-headers/include" -DMDS_DXC="$PWD/out/dxc/bin/dxc"
          if [ "${{ inputs.ui_only }}" = true ]; then
            cmake --build out/p4 --target qt_editor_font_test qt_editor_chrome_test qt_numeric_test qt_edit_navigation_test qt_static_label_test --parallel 3
            ctest --test-dir out/p4 -R '^(qt_editor_font|qt_editor_chrome|qt_numeric|qt_edit_navigation|qt_static_label)$' --output-on-failure --output-junit p4.xml
            exit $?
          fi
          cmake --build out/p4 --parallel 3
          ctest --test-dir out/p4 -L p4 --output-on-failure --output-junit p4.xml
          MDS_QT_ISOLATED_DISPLAY=1 MDS_GPU_BACKEND=metal python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test --assets res/assets
          MDS_QT_ISOLATED_DISPLAY=1 out/p4/qt_metal_present_test
          MDS_QT_ISOLATED_DISPLAY=1 QT_SCALE_FACTOR=2 out/p4/qt_metal_present_test
          MDS_QT_ISOLATED_DISPLAY=1 QT_SCALE_FACTOR=2 MDS_GPU_BACKEND=metal python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test --assets res/assets
          # MoltenVK currently trips an MTLDebugDevice lifetime assertion. Keep
          # native Metal API validation above; run the existing Vulkan checks
          # and cross-backend menu transaction in their own process below.
          MTL_DEBUG_LAYER=0 MDS_QT_ISOLATED_DISPLAY=1 MDS_QT_TEST_BACKEND_SWITCH=1 python tests/test_runtime_cpu_scene.py --passes out/p4/qt_presentation_test --assets res/assets
      - name: Qualify original composite capture and retain numerical diagnostics
        if: ${{ !cancelled() && inputs.native_reference }}
        env:
          MDS_GPU_BACKEND: metal
        run: ctest --test-dir out/p4 -L native-reference --output-on-failure --output-junit native-reference.xml
      - name: Qualify native Japanese input and command ordering
        if: ${{ !cancelled() && inputs.system_ime }}
        env:
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          cmake --build out/p4 --target qt_system_ime_test --parallel 3
          python tests/test_native_system_ime.py --test out/p4/qt_system_ime_test --report out/p4/system-ime-kotoeri.json
      - name: Actual shown portable controls and menus
        if: ${{ !cancelled() && inputs.ui_shown }}
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: cocoa
          MDS_QT_ISOLATED_DISPLAY: '1'
        run: |
          cmake --build out/p4 --target qt_shown_ui_test --parallel 3
          python tests/test_shown_ui.py --test out/p4/qt_shown_ui_test --assets res/assets --output out/p4/shown-ui
      - name: Native CoreAudio silent clock
        if: ${{ !cancelled() && !inputs.ui_only }}
        run: python tests/test_native_audio.py --test out/p4/qt_native_audio_test --report out/p4/native-audio.json --allow-unavailable
      - name: Deploy and validate relocated package
        if: ${{ !cancelled() && !inputs.ui_only }}
        shell: bash
        run: |
          cmake --build out/p4 --config Release --target dist --parallel 3
          python tests/test_editor_distribution.py --dist out/dist
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.ui_only }}
        with:
          name: editor-dist-macos
          path: |
            out/releases/MikuDanceStudio-NG-*.zip
            out/releases/MikuDanceStudio-NG-*.tar.gz
            out/releases/MikuDanceStudio-NG-*.sha256
          if-no-files-found: error
      - name: Verify a native Metal package without MoltenVK
        if: ${{ !cancelled() && !inputs.ui_only }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          MTL_DEBUG_LAYER: '1'
        run: |
          cmake -S cmake/portable-editor -B out/p4 -DMIKUDANCESTUDIO_RHI_VULKAN=OFF
          cmake --build out/p4 --target dist --parallel 3
          python tests/test_editor_distribution.py --dist out/dist --report out/p4/metal-only-distribution.json
          test ! -f out/dist/MikuDanceStudioNG.app/Contents/Frameworks/libMoltenVK.dylib
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .cache/ccache
          key: editor-objects-${{ env.MDS_MACOS_CACHE }}-${{ runner.arch }}-qt683-v1-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-macos
          path: |
            out/p4/p4.xml
            out/p4/native-reference.xml
            out/p4/native-reference/
            out/p4/system-ime*
            out/p4/editor-chrome/
            out/p4/shown-ui/
            out/p4/static-label-portable/
            out/distribution-check.*
            out/p4/metal-only-distribution.*
            out/p4/editor-frame-performance*.json
            out/p4/native-audio*.json
            out/p4/Testing/Temporary/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-dist-*
          merge-multiple: true
          path: packages
      - name: Create draft release from tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            test "$(cat release-state.txt)" = true
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MikuDanceStudio-NG $RELEASE_TAG" --generate-notes packages/*
          fi
